version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: mysql_ani
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: anitalk
      MYSQL_USER: aniuser
      MYSQL_PASSWORD: anipass
    ports:
      - "3306"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
